<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin login — Crate Coffee Co</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="login-shell">
  <div class="login-card">
    <h2 style="margin-bottom:4px;">Crate Admin</h2>
    <p style="color:var(--ink-soft);margin-bottom:22px;">Sign in to manage products, orders and settings.</p>
    <div class="demo-note">First time here? Create the admin account in the Firebase console under <strong>Authentication → Users → Add user</strong>, then sign in below. See README for details.</div>
    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <div id="loginError" style="color:var(--brick);font-size:.86rem;margin-bottom:14px;display:none;"></div>
      <button type="submit" class="btn btn-gold btn-block" id="loginBtn">Sign in</button>
    </form>
    <p style="margin-top:20px;font-size:.86rem;text-align:center;"><a href="../index.html" style="text-decoration:underline;">← Back to site</a></p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="../js/firebase-init.js"></script>
<script>
auth.onAuthStateChanged(user => { if (user) location.href = 'dashboard.html'; });

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  try{
    await auth.signInWithEmailAndPassword(
      document.getElementById('email').value.trim(),
      document.getElementById('password').value
    );
    location.href = 'dashboard.html';
  }catch(err){
    errEl.textContent = 'Could not sign in — check the email and password, or create the account in Firebase first.';
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
