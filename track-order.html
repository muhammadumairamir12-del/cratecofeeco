<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track your order — Crate Coffee Co</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .page-head{background:var(--espresso);color:var(--paper-soft);padding:64px 0 44px;}
  .track-box{max-width:480px;}
  .status-track{display:flex;justify-content:space-between;margin:30px 0;position:relative;}
  .status-track::before{content:'';position:absolute;top:11px;left:0;right:0;height:2px;background:var(--line);}
  .st-step{position:relative;text-align:center;flex:1;font-size:.76rem;color:var(--ink-soft);}
  .st-step .dot{width:24px;height:24px;border-radius:50%;background:var(--paper-soft);border:2px solid var(--line);margin:0 auto 8px;position:relative;z-index:1;}
  .st-step.done .dot{background:var(--gold);border-color:var(--gold);}
  .st-step.done{color:var(--ink);font-weight:600;}
</style>
</head>
<body data-page="track">

<div id="site-header"></div>
<div id="cart-mount"></div>

<header class="page-head">
  <div class="wrap">
    <div class="hero-eyebrow" style="color:var(--gold-bright);">Order status</div>
    <h1 style="color:var(--paper-soft);">Track your order</h1>
  </div>
</header>

<section>
  <div class="wrap track-box">
    <form id="trackForm">
      <div class="field">
        <label for="orderIdInput">Order number</label>
        <input type="text" id="orderIdInput" placeholder="e.g. A1B2C3" required>
      </div>
      <button class="btn btn-gold btn-block" type="submit">Check status</button>
    </form>
    <div id="trackResult" style="margin-top:30px;"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script>
const STEPS = ['Received', 'Preparing', 'Ready', 'Completed'];

document.getElementById('trackForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const code = document.getElementById('orderIdInput').value.trim().toUpperCase();
  const resultEl = document.getElementById('trackResult');
  resultEl.innerHTML = 'Searching…';
  try{
    const snap = await db.collection('orders').get();
    const match = snap.docs.find(d => d.id.slice(-6).toUpperCase() === code);
    if (!match){
      resultEl.innerHTML = '<p style="color:var(--brick);">No order found with that number.</p>';
      return;
    }
    const o = match.data();
    if (o.status === 'Cancelled'){
      resultEl.innerHTML = '<p><span class="pill-status pill-cancelled">Cancelled</span></p>';
      return;
    }
    const idx = STEPS.indexOf(o.status);
    resultEl.innerHTML = `
      <p>Order <strong>#${code}</strong> for ${o.customerName || 'you'}</p>
      <div class="status-track">
        ${STEPS.map((s, i) => `<div class="st-step ${i <= idx ? 'done' : ''}"><div class="dot"></div>${s}</div>`).join('')}
      </div>
    `;
  }catch(err){
    resultEl.innerHTML = '<p style="color:var(--brick);">Something went wrong — please try again.</p>';
  }
});

mountLayout('track');
</script>
</body>
</html>
