<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu — Crate Coffee Co</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .menu-head{background:var(--espresso);color:var(--paper-soft);padding:64px 0 44px;}
  .menu-head .hero-eyebrow{color:var(--gold-bright);}
  #emptyState{display:none;text-align:center;padding:60px 0;color:var(--ink-soft);}
</style>
</head>
<body data-page="menu">

<div id="site-header"></div>
<div id="cart-mount"></div>

<header class="menu-head">
  <div class="wrap">
    <div class="hero-eyebrow">The full crate</div>
    <h1 style="color:var(--paper-soft);">Menu</h1>
    <p style="color:rgba(243,236,221,.78);max-width:50ch;">Coffee, bakery, and cakes from the Loughton counter. Prices are in dollars. Sold-out items are marked below.</p>
  </div>
</header>

<section class="section-tight">
  <div class="wrap shop-layout">
    <div>
      <div class="cat-row" id="catRow"></div>
      <div class="crate-grid" id="menuGrid"></div>
      <div id="emptyState">Nothing in this category today — check back tomorrow.</div>
    </div>
    <aside class="place-side" id="placeSide"></aside>
  </div>
</section>

<div id="site-footer"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script>
let ALL_PRODUCTS = [];
let ACTIVE_CAT = 'All';

function cardHtml(p){
  const oos = p.inStock === false;
  return `
    <div class="crate-card ${oos ? 'out-of-stock' : ''}">
      ${oos ? '<span class="badge-oos">Sold out</span>' : ''}
      <div class="stamp-icon">${productArt(p)}</div>
      <h3>${p.name}</h3>
      <div class="desc">${p.desc || ''}</div>
      <div class="row">
        <span class="price">${formatPrice(p.price)}</span>
        <button class="add-btn" ${oos ? 'disabled' : ''} onclick='addToCart(${jsonAttr(p)})'>${oos ? 'Sold out' : 'Add'}</button>
      </div>
    </div>`;
}

function renderMenu(){
  const grid = document.getElementById('menuGrid');
  const list = ACTIVE_CAT === 'All' ? ALL_PRODUCTS : ALL_PRODUCTS.filter(p => p.category === ACTIVE_CAT);
  grid.innerHTML = list.map(cardHtml).join('');
  document.getElementById('emptyState').style.display = list.length ? 'none' : 'block';
}

function renderCategoryRow(){
  const cats = ['All', ...new Set(ALL_PRODUCTS.map(p => p.category))];
  document.getElementById('catRow').innerHTML = cats.map(c =>
    `<button class="cat-chip ${c === ACTIVE_CAT ? 'active' : ''}" data-cat="${c}">${c}</button>`
  ).join('');
  document.querySelectorAll('.cat-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      ACTIVE_CAT = btn.dataset.cat;
      renderCategoryRow();
      renderMenu();
    });
  });
}

(async () => {
  const settings = await mountLayout('menu');
  document.getElementById('placeSide').innerHTML = renderPlaceSide(settings);
  ALL_PRODUCTS = await fetchProducts();
  const params = new URLSearchParams(location.search);
  if (params.get('category')) ACTIVE_CAT = params.get('category');
  renderCategoryRow();
  renderMenu();
})();
</script>
</body>
</html>
